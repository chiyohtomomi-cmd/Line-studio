<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Line Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3F9C71">
<meta name="description" content="Free tool for coloring-book creators: find and close gaps in line art, fix lines, export clean pages. Works offline. Nothing is uploaded.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Line Studio</title>
<style>
:root{
  --bg:#F4F2EC; --surface:#FFFFFF; --surface2:#EEEBE3; --ink:#24211C; --muted:#6F695E; --line:#DDD8CC;
  --green:#3F9C71; --green-text:#FFFFFF; --green-soft:#DDEFE5;
  --red:#D64545; --yellow:#C99A1E; --gray:#8A847A; --stage:#E4E0D6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171512; --surface:#221F1B; --surface2:#2C2823; --ink:#F1EDE6; --muted:#A8A196; --line:#3A352E;
    --green:#5BB48A; --green-text:#0F1A14; --green-soft:#21362B;
    --red:#F06A6A; --yellow:#E5BC4A; --gray:#9C958A; --stage:#100F0D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171512; --surface:#221F1B; --surface2:#2C2823; --ink:#F1EDE6; --muted:#A8A196; --line:#3A352E;
  --green:#5BB48A; --green-text:#0F1A14; --green-soft:#21362B;
  --red:#F06A6A; --yellow:#E5BC4A; --gray:#9C958A; --stage:#100F0D; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--green);outline-offset:2px}
.btn{min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-text)}
.btn.big{width:100%;min-height:52px;font-size:17px}
.btn:disabled{opacity:.4;cursor:default}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.ib:disabled{opacity:.35;cursor:default}
.ib[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-text)}
.ib svg,.tool svg,.btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---------- library ---------- */
#lib{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
.libhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.libhead h1{font-size:26px;margin:0;flex:1;min-width:160px;letter-spacing:-0.01em}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.libactions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.libactions label.btn input{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card .open{display:block;width:100%;border:0;padding:0;background:#fff;cursor:pointer}
.card img{display:block;width:100%;aspect-ratio:900/1189;object-fit:contain;background:#fff}
.card .meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.card .num{font-weight:700}
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.badge.none{background:var(--surface2);color:var(--muted)}
.card .warn{font-size:12px;color:var(--yellow)}
.card .size{font-size:12px;color:var(--muted)}
.label{font-size:14px;color:var(--muted);min-width:88px}
#exportSettings{margin:-4px 0 14px}
.backup{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.backuptext{display:flex;flex-direction:column;font-size:14px;min-width:200px;flex:1}
.backuptext span{color:var(--muted)}
.backuptext span.warn{color:var(--yellow)}
#exportSettings .seg button{padding:6px 10px}
.card .del{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.card .del.armed{background:var(--red);border-color:var(--red);color:#fff;width:auto;border-radius:18px;padding:0 10px;font-size:13px}
.empty{border:2px dashed var(--line);border-radius:18px;padding:34px 18px;text-align:center;color:var(--muted)}
.libstatus{min-height:22px;color:var(--muted);font-size:14px;margin:-6px 0 12px}
.saved{font-size:12px;color:var(--muted)}
.saved::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:1px}
/* ---------- editor ---------- */
#ed{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#ed.open{display:flex}
.top{display:flex;align-items:center;gap:4px;padding:8px 6px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .mid{flex:1;min-width:52px;text-align:center;line-height:1.15}
.top .mid b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grp{display:flex;gap:4px}
.top .ib{width:42px;height:44px}
.top .mid .saved{font-size:11px}
#stage{position:relative;flex:1;overflow:hidden;background:var(--stage);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
.zoombox{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoombox .ib{width:40px;height:40px;opacity:.92}
.flag{position:absolute;left:8px;top:8px;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:600;display:none}
.flag.on{display:block}
.bottom{background:var(--surface);border-top:1px solid var(--line)}
.panel{padding:12px 14px 6px;max-height:42vh;overflow:auto}
.panel h3{margin:0 0 6px;font-size:16px}
.panel p{margin:4px 0 10px;color:var(--muted);font-size:14px}
.prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.chip{min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:6px 12px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.slider{display:flex;align-items:center;gap:10px;margin:8px 0}
.slider input{flex:1;height:44px;accent-color:var(--green)}
.slider .v{min-width:64px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.slider small{color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;min-height:40px;padding:6px 14px;border-radius:11px;font-weight:600;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--green-text)}
.fixbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--green-soft);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:14px;font-weight:600}
.note{font-size:13px;color:var(--yellow);margin:4px 0 8px}
.tray{display:flex;justify-content:space-around;padding:4px 4px 6px;border-top:1px solid var(--line)}
.tool{flex:1;max-width:96px;min-height:54px;border:0;background:transparent;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tool[aria-pressed="true"]{color:var(--green);background:var(--green-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(68px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
#ready{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border-top:2px solid var(--green);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:none;flex-wrap:wrap;gap:10px;align-items:center}
#ready.on{display:flex}
#ready .t{flex:1;min-width:150px;font-size:14px}
#ready a.btn{text-decoration:none;color:var(--green-text)}
.busy{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 55%,transparent);z-index:80;display:none;align-items:center;justify-content:center}
.busy.on{display:flex}
.busy div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 22px;font-weight:600}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
@media (min-width:700px){ .panel{max-width:760px;margin:0 auto} }
@media (orientation:landscape) and (max-height:600px){
  #ed.open{display:grid;grid-template-columns:1fr minmax(300px,36%);grid-template-rows:auto 1fr}
  .top{grid-column:1/3}
  #stage{grid-column:1;grid-row:2}
  .bottom{grid-column:2;grid-row:2;display:flex;flex-direction:column;border-top:0;border-left:1px solid var(--line);min-height:0}
  .panel{flex:1;max-height:none;margin:0}
}
</style>
</head>
<body>
<main id="lib">
  <div class="libhead">
    <h1>Line Studio</h1>
    <span class="saved" id="libSaved" hidden>Saved</span>
  </div>
  <p class="sub">Check gaps, close them, fix lines, export clean pages. Everything stays on this device.</p>
  <div class="libactions">
    <label class="btn primary"><input type="file" id="fileIn" accept="image/png,image/jpeg" multiple>Open pictures</label>
    <button class="btn" id="checkAllBtn" disabled>Check all</button>
    <button class="btn" id="exportAllBtn" disabled>Export all (ZIP)</button>
  </div>
  <div class="backup">
    <div class="backuptext"><b>Backup</b><span id="backupNote">Your work is saved on this device automatically.</span></div>
    <div class="prow">
      <button class="btn" id="backupBtn" disabled>Save backup</button>
      <label class="btn"><input type="file" id="restoreIn" accept=".zip,application/zip" hidden>Open backup</label>
    </div>
  </div>
  <div id="exportSettings"></div>
  <div class="libstatus" id="libStatus" role="status"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Open your line-art pages (PNG or JPG) to start.<br>Pick a whole story at once.</div>
</main>

<section id="ed" aria-label="Page editor">
  <div class="top">
    <button class="ib" id="backBtn" aria-label="Back to pages"><svg viewBox="0 0 24 24"><path d="M4 5h6v6H4zM14 5h6v6h-6zM4 15h6v6H4zM14 15h6v6h-6z"/></svg></button>
    <button class="ib" id="prevBtn" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="mid"><b id="pageName">01</b><span class="saved" id="edSaved">Saved</span></div>
    <button class="ib" id="nextBtn" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="grp">
      <button class="ib" id="undoBtn" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="ib" id="redoBtn" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button class="ib" id="baBtn" aria-label="Show before" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/><path d="M12 4h7a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-7z" fill="currentColor" stroke="none" opacity=".35"/></svg></button>
      <button class="ib" id="exportBtn" aria-label="Export this page"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg></button>
    </div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <canvas id="ov"></canvas>
    <div class="flag" id="flag">Before</div>
    <div class="zoombox">
      <button class="ib" id="zIn" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" id="zOut" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="ib" id="zFit" aria-label="Fit page"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <div class="bottom">
    <div class="panel" id="panel"></div>
    <nav class="tray" aria-label="Tools">
      <button class="tool" data-tool="check" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Check</button>
      <button class="tool" data-tool="close" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 12h5M15 12h5"/><path d="M9 12h6" stroke-dasharray="2 2"/><circle cx="12" cy="12" r="8"/></svg>Close</button>
      <button class="tool" data-tool="lines" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h16" stroke-width="1"/><path d="M4 12h16" stroke-width="2.2"/><path d="M4 17h16" stroke-width="3.6"/></svg>Lines</button>
      <button class="tool" data-tool="draw" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>Draw</button>
      <button class="tool" data-tool="clean" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>Clean</button>
    </nav>
  </div>
</section>

<div class="toast" id="toast" role="status"></div>
<div id="ready"><div class="t"><b id="readyName"></b><br><span style="color:var(--muted)">Ready. Tap to save it.</span></div><a class="btn primary" id="readyDl">Download</a><button class="btn" id="readyShare" hidden>Share / Save to Files</button><button class="ib" id="readyX" aria-label="Close">✕</button></div>
<div class="busy" id="busy"><div id="busyText">Working…</div></div>
<script>
// ===================== Line Studio core (pure functions, typed arrays) =====================
const LS = {};
LS.binarize = function (gray, thr) {
  const n = gray.length, b = new Uint8Array(n);
  for (let i = 0; i < n; i++) b[i] = gray[i] < thr ? 1 : 0;
  return b;
};
// Zhang–Suen thinning
LS.skeletonize = function (bin, w, h) {
  const s = bin.slice();
  for (let x = 0; x < w; x++) { s[x] = 0; s[(h - 1) * w + x] = 0; }
  for (let y = 0; y < h; y++) { s[y * w] = 0; s[y * w + w - 1] = 0; }
  let cand = [];
  for (let i = 0; i < s.length; i++) if (s[i]) cand.push(i);
  const del = [];
  let changed = true;
  while (changed) {
    changed = false;
    for (let pass = 0; pass < 2; pass++) {
      del.length = 0;
      const next = [];
      for (let k = 0; k < cand.length; k++) {
        const i = cand[k];
        if (!s[i]) continue;
        next.push(i);
        const p2 = s[i - w], p3 = s[i - w + 1], p4 = s[i + 1], p5 = s[i + w + 1],
          p6 = s[i + w], p7 = s[i + w - 1], p8 = s[i - 1], p9 = s[i - w - 1];
        const B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
        if (B < 2 || B > 6) continue;
        const A = (!p2 && p3) + (!p3 && p4) + (!p4 && p5) + (!p5 && p6) +
          (!p6 && p7) + (!p7 && p8) + (!p8 && p9) + (!p9 && p2);
        if (A !== 1) continue;
        if (pass === 0) { if (p2 * p4 * p6 || p4 * p6 * p8) continue; }
        else { if (p2 * p4 * p8 || p2 * p6 * p8) continue; }
        del.push(i);
      }
      for (const i of del) s[i] = 0;
      if (del.length) changed = true;
      cand = next;
    }
  }
  return s;
};
// 4-connected labeling of free (non-line) pixels
LS.labelFree = function (bin, w, h) {
  const n = w * h, labels = new Int32Array(n), sizes = [0], sx = [0], sy = [0];
  const stack = new Int32Array(n);
  let count = 0;
  for (let i = 0; i < n; i++) {
    if (bin[i] || labels[i]) continue;
    count++;
    let sp = 0, size = 0, ax = 0, ay = 0;
    stack[sp++] = i; labels[i] = count;
    while (sp) {
      const c = stack[--sp]; size++;
      const x = c % w; ax += x; ay += (c - x) / w;
      if (x > 0 && !bin[c - 1] && !labels[c - 1]) { labels[c - 1] = count; stack[sp++] = c - 1; }
      if (x < w - 1 && !bin[c + 1] && !labels[c + 1]) { labels[c + 1] = count; stack[sp++] = c + 1; }
      if (c >= w && !bin[c - w] && !labels[c - w]) { labels[c - w] = count; stack[sp++] = c - w; }
      if (c < n - w && !bin[c + w] && !labels[c + w]) { labels[c + w] = count; stack[sp++] = c + w; }
    }
    sizes.push(size); sx.push(ax / size); sy.push(ay / size);
  }
  return { labels, count, sizes, sx, sy };
};
// anti-aliased round-capped line ("capsule"). mode 'ink' darkens, 'erase' lightens, 'bin' sets 1.
LS.capsule = function (arr, w, h, x1, y1, x2, y2, r, mode) {
  const minX = Math.max(0, Math.floor(Math.min(x1, x2) - r - 1)), maxX = Math.min(w - 1, Math.ceil(Math.max(x1, x2) + r + 1));
  const minY = Math.max(0, Math.floor(Math.min(y1, y2) - r - 1)), maxY = Math.min(h - 1, Math.ceil(Math.max(y1, y2) + r + 1));
  const vx = x2 - x1, vy = y2 - y1, L2 = vx * vx + vy * vy;
  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      const px = x + 0.5, py = y + 0.5;
      let t = L2 ? ((px - x1) * vx + (py - y1) * vy) / L2 : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const dx = px - (x1 + t * vx), dy = py - (y1 + t * vy);
      const d = Math.sqrt(dx * dx + dy * dy);
      let cov = r + 0.5 - d; if (cov <= 0) continue; if (cov > 1) cov = 1;
      const i = y * w + x;
      if (mode === 'bin') { if (cov > 0.35) arr[i] = 1; }
      else if (mode === 'erase') { const v = Math.round(255 * cov); if (v > arr[i]) arr[i] = v; }
      else { const v = Math.round(255 * (1 - cov)); if (v < arr[i]) arr[i] = v; }
    }
  }
  return [minX, minY, maxX, maxY];
};
// count free pixels on the segment between two line centers = real gap width
function gapWidth(bin, w, x1, y1, x2, y2) {
  const len = Math.hypot(x2 - x1, y2 - y1), steps = Math.max(1, Math.ceil(len * 2));
  let free = 0, lastIdx = -1;
  for (let s = 0; s <= steps; s++) {
    const x = Math.round(x1 + (x2 - x1) * s / steps), y = Math.round(y1 + (y2 - y1) * s / steps);
    const i = y * w + x; if (i === lastIdx) continue; lastIdx = i;
    if (!bin[i]) free++;
  }
  return free;
}
// true if the middle of the segment runs through other ink (it would cross a line, not bridge a gap)
function crossesInk(bin, w, x1, y1, x2, y2, stroke) {
  const len = Math.hypot(x2 - x1, y2 - y1), steps = Math.ceil(len);
  const skip = stroke * 0.8 + 1;
  let run = 0;
  for (let s = 0; s <= steps; s++) {
    const t = s / steps, d = t * len;
    if (d < skip || d > len - skip) continue;
    const px = Math.round(x1 + (x2 - x1) * t), py = Math.round(y1 + (y2 - y1) * t);
    if (bin[py * w + px]) { run++; if (run > 1) return true; } else run = 0;
  }
  return false;
}

// ---------- gestures: one finger draws (or taps), two fingers move & zoom ----------
const ptrs = new Map(); let gesture = null, stroke = null, tapStart = null, locked = false;
